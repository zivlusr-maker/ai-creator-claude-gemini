<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 电商创作工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <aside class="sidebar" id="sidebar">

      <a href="#" class="nav-item active" data-page="image-gen">

      <a href="#" class="nav-item" data-page="video-gen">
        <span class="nav-icon">🎬</span><span>视频生成</span>

      <a href="#" class="nav-item" data-page="reverse-prompt">
        <span class="nav-icon">🔍</span><span>反推提示词</span>

      </a>
      <a href="#" class="nav-item" data-page="video-motion">

      </a>
      <a href="#" class="nav-item" data-page="digital-human">
        <span class="nav-icon">🧑‍💻</span><span>数字人</span>
      </a>

      <a href="#" class="nav-item" data-page="chat">
        <span class="nav-icon">💬</span><span>AI 对话</span>
      </a>
      <a href="#" class="nav-item" data-page="image-dewatermark">
        <span class="nav-icon">🗑</span><span>图片去水印</span>
      </a>
      <a href="#" class="nav-item" data-page="video-dewatermark">

      <a href="#" class="nav-item" data-page="batch-gen">

        <span class="nav-icon">🗺</span><span>无限画布</span>
      </a>
      <a href="#" class="nav-item" data-page="ecommerce-detail">

      </a>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">✦</div>
        <div class="user-meta">
          <div class="user-name">设计师账户</div>
          <div class="user-plan">专业版</div>
        </div>
      </div>

  <!-- 主内容区 -->
  <main class="main-content" id="main-content">
    <!-- 页面将通过 JS 动态注入 -->
  </main>

  <script src="js/prompts.js"></script>
  <script src="js/app.js"></script>

</html>
